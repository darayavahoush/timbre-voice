# fly launch --no-deploy --copy-config   (pick your own app name)
# fly volumes create timbre_data --size 1
# fly secrets set SECRET_KEY_BASE=$(openssl rand -base64 48) PHX_HOST=<app>.fly.dev [OPENAI_API_KEY=...]
# fly deploy
app = "timbre-voice"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/timbre.db"

[mounts]
  source = "timbre_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Live session rooms are in-memory on one node: keep exactly one machine up.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
